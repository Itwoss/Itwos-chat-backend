name: itwos-chat-backend
services:
  - name: backend
    github:
      repo: Itwoss/Itwos-chat-backend
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm install
    run_command: node server.js
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs  # Adjust based on your needs (basic-xxs, basic-xs, basic-s, etc.)
    http_port: 5001
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    routes:
      - path: /
    # CRITICAL: Environment variables for backend
    # These are available at RUN_TIME (unlike frontend which needs BUILD_TIME)
    envs:
      - key: PORT
        value: "5001"
        scope: RUN_TIME
      - key: NODE_ENV
        value: "production"
        scope: RUN_TIME  # CRITICAL: Must be 'production' for cookies to work
      - key: FRONTEND_URL
        value: "https://app.itwos.store"
        scope: RUN_TIME
      - key: BACKEND_URL
        value: "https://api.itwos.store"
        scope: RUN_TIME
      - key: MONGODB_URI
        value: "your_mongodb_connection_string"
        scope: RUN_TIME
      - key: APP_NAME
        value: "itwos"
        scope: RUN_TIME
      - key: JWT_SECRET
        value: "your_jwt_secret_key"
        scope: RUN_TIME
      - key: JWT_EXPIRE
        value: "7d"
        scope: RUN_TIME
      - key: R2_ACCOUNT_ID
        value: "your_r2_account_id"
        scope: RUN_TIME
      - key: R2_ACCESS_KEY_ID
        value: "your_r2_access_key_id"
        scope: RUN_TIME
      - key: R2_SECRET_ACCESS_KEY
        value: "your_r2_secret_access_key"
        scope: RUN_TIME
      - key: R2_BUCKET_NAME
        value: "your_r2_bucket"
        scope: RUN_TIME
      - key: R2_PUBLIC_BASE_URL
        value: "https://pub-xxxx.r2.dev"
        scope: RUN_TIME
      - key: ENCRYPTION_KEY
        value: "your_encryption_key"
        scope: RUN_TIME
      - key: RAZORPAY_KEY_ID
        value: "your_razorpay_key_id"
        scope: RUN_TIME
      - key: RAZORPAY_KEY_SECRET
        value: "your_razorpay_key_secret"
        scope: RUN_TIME
      - key: YOUTUBE_API_KEY
        value: "your_youtube_api_key"
        scope: RUN_TIME
